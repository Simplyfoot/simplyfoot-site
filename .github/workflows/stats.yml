name: Stats

on:
    pull_request:
        branches: ['main']

jobs:
    stats:
        name: Generate and comment code statistics
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci

            - name: Generate code statistics
              id: stats
              run: |
                  echo "STATS_OUTPUT<<EOF" >> $GITHUB_OUTPUT
                  npm run stats --silent >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Comment PR with stats
              uses: actions/github-script@v7
              env:
                  STATS_OUTPUT: ${{ steps.stats.outputs.STATS_OUTPUT }}
              with:
                  script: |
                      const statsOutput = process.env.STATS_OUTPUT;
                      const comment = `<!-- statistics-comment -->
                      ## Code Statistics

                      \`\`\`
                      ${statsOutput}
                      \`\`\`

                      _Statistics generated by \`npm run stats\` on commit ${{ github.sha }}_`;

                      const { data: comments } = await github.rest.issues.listComments({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                      });

                      const botComment = comments.find(c =>
                          c.user.type === 'Bot' &&
                          c.body.includes('<!-- statistics-comment -->')
                      );

                      if (botComment) {
                          await github.rest.issues.updateComment({
                              comment_id: botComment.id,
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              body: comment
                          });
                      } else {
                          await github.rest.issues.createComment({
                              issue_number: context.issue.number,
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              body: comment
                          });
                      }
